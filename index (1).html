<script>
const COURSES = [
 {id:'mech',title:'Mechanik',short:'Statik & Systeme',emoji:'⚙️',color:'#3c8a79',status:'good',desc:'Freischneiden, Kräfte, Momente, Lager, Seile und Reibung.',sources:['Skript_MECH_WSK1 Teil 1 · HSLU T&A · 17.09.2026','Übungen MECH WSK1 Teil 1','Mechanik_Lernheft_3-4_Stunden.pdf · ergänzende Zusammenfassung'],topics:[
  {group:'Grundlagen',title:'Statik & Freischneiden',intro:'In der Statik werden ruhende Systeme untersucht. Beim Freischneiden ersetzt du die Umgebung durch die Kräfte und Momente, die sie auf den betrachteten Körper ausübt.',points:['Körper und Systemgrenze festlegen.','Gewichtskraft am Schwerpunkt ansetzen: \\(F_G=m\,g\\).','Lager, Seile und Kontakte durch ihre Reaktionskräfte ersetzen.','Für ebene Gleichgewichte gelten zwei Kraftgleichungen und eine Momentengleichung.'],math:'\\[\\sum F_x=0,\\qquad \\sum F_y=0,\\qquad \\sum M_A=0\\]',example:{q:'Ein Körper mit der Masse 5 kg liegt ruhig auf einer horizontalen Fläche. Wie gross ist die Gewichtskraft?',steps:['Gegeben: \\(m=5\\,\\mathrm{kg}\\), Erdbeschleunigung \\(g\\approx9.81\\,\\mathrm{m/s^2}\\).','Einsetzen in \\(F_G=m g\\).'],answer:'\\(F_G=5\\cdot9.81=49.05\\,\\mathrm N\\). Im vertikalen Gleichgewicht wirkt die Normalkraft gleich gross nach oben.'},source:'Skript MECH WSK1, Kapitel 1; Lernheft, Freischneide-Methode.'},
  {group:'Kräfte & Momente',title:'Kraftkomponenten & Resultierende',intro:'Eine schräge Kraft wird in Komponenten entlang der gewählten Achsen zerlegt. Das Vorzeichen kommt von der Richtung der Komponente, nicht vom Winkel allein.',points:['Winkel von der x-Achse: \\(F_x=F\\cos\\alpha\\), \\(F_y=F\\sin\\alpha\\).','Komponenten gleicher Achse mit Vorzeichen addieren.','Betrag der Resultierenden: Satz des Pythagoras, wenn die Komponenten rechtwinklig sind.','Richtung mit \\(\\operatorname{atan2}(F_y,F_x)\\) oder passend gewähltem Umkehrfunktion-Quadranten prüfen.'],math:'\\[F_x=F\\cos\\alpha,\\quad F_y=F\\sin\\alpha,\\quad R=\\sqrt{(\\sum F_x)^2+(\\sum F_y)^2}\\]',example:{q:'Eine Kraft von 100 N wirkt unter 45° über der positiven x-Achse. Bestimme ihre Komponenten.',steps:['Der Winkel wird von der x-Achse gemessen.','Sinus und Kosinus bei 45° sind gleich.'],answer:'\\(F_x=100\\cos45^\\circ\\approx70.7\\,\\mathrm N\\), \\(F_y=100\\sin45^\\circ\\approx70.7\\,\\mathrm N\\).'},source:'Skript MECH WSK1, Kapitel 1; Übungen 1.1–1.7.'},
  {group:'Kräfte & Momente',title:'Moment einer Kraft',intro:'Ein Moment beschreibt die Drehwirkung einer Kraft um einen Bezugspunkt. Entscheidend ist der senkrechte Abstand der Wirkungslinie zum Bezugspunkt.',points:['In der Ebene gilt betragsmässig \\(M=F d_\\perp\\).','Drehrichtung mit einer festen Vorzeichenkonvention angeben.','Eine Kraft durch den Momentenpunkt hat dort keinen Hebelarm.','Ein Kräftepaar kann ein reines Moment erzeugen, auch wenn die Resultierende null ist.'],math:'\\[M_A=\\vec r_{A\\to P}\\times\\vec F,\\qquad |M_A|=F d_\\perp\\]',example:{q:'Eine senkrechte Kraft von 30 N greift mit einem Hebelarm von 0.20 m an. Wie gross ist das Moment?',steps:['Kraft und Hebelarm stehen senkrecht.','Momentenbetrag aus Kraft mal senkrechtem Abstand.'],answer:'\\(|M|=30\\cdot0.20=6.0\\,\\mathrm{N m}\\). Das Vorzeichen hängt davon ab, ob die Kraft im gewählten Sinn dreht.'},source:'Skript MECH WSK1, Kapitel 2; Übungen 1.6.'},
  {group:'Gleichgewicht',title:'Lagerreaktionen',intro:'Beim Auflösen eines Systems in seine Lagerreaktionen wird jedes Lager durch das passende Reaktionsmodell ersetzt. Die Unbekannten ergeben sich aus der Lagerart.',points:['Ein Loslager liefert im ebenen Modell eine Kraft normal zur Auflage.','Ein Gelenklager liefert zwei Kraftkomponenten, aber kein Reaktionsmoment.','Eine Einspannung kann zwei Kraftkomponenten und ein Moment übertragen.','Unbekannte zunächst mit angenommener Richtung einzeichnen; ein negatives Ergebnis bedeutet Gegenrichtung.'],math:'\\[\\sum F_x=0,\\qquad \\sum F_y=0,\\qquad \\sum M_A=0\\]',source:'Übungen MECH WSK1; ergänzende Mechanik-Lernheft-Blöcke zu Freischneiden und Lagerreaktionen.'},
  {group:'Seile & Reibung',title:'Seile, Rollen & Knotenpunkte',intro:'Ein ideales Seil überträgt Zug entlang seiner eigenen Richtung, aber keinen Druck. Bei idealer, masseloser Rolle ohne Reibung bleibt die Seilspannung auf beiden Seiten gleich.',points:['Am einzelnen Knotenpunkt den Knoten freischneiden und alle Seilkräfte entlang der Seile ansetzen.','Für jeden Knoten separat \\(\\sum F_x=0\\) und \\(\\sum F_y=0\\) bilden.','Bei einer beweglichen idealen Rolle tragen mehrere Seilabschnitte die Last; die Anzahl tragender Stränge aus der Skizze bestimmen.','Reale Lagerreibung oder Seilmasse nur berücksichtigen, wenn die Aufgabe sie ausdrücklich angibt.'],math:'\\[\\text{ideales Seil / ideale Rolle: }T_1=T_2\\]',diagram:'node',example:{q:'Eine ruhende Masse hängt an einem einzelnen senkrechten idealen Seil. Wie hängt die Seilspannung mit der Gewichtskraft zusammen?',steps:['Masse freischneiden.','Nach oben wirkt die Seilspannung \\(T\\), nach unten \\(F_G\\).','Vertikales Gleichgewicht aufstellen.'],answer:'\\(T-F_G=0\\), also \\(T=F_G=m g\\).'},source:'Skript MECH WSK1, Kapitel 1; Übungen MECH WSK1; Lernheft, Seile und Rollen.'},
  {group:'Seile & Reibung',title:'Haft- und Gleitreibung',intro:'Die Reibungskraft liegt tangential zur Kontaktfläche und wirkt der drohenden beziehungsweise tatsächlichen Relativbewegung entgegen.',points:['Haftreibung passt sich bis zu einem Grenzwert an.','Grenzfall: \\(F_H=\\mu_H N\\).','Bei Gleiten wird oft \\(F_R=\\mu_G N\\) angesetzt.','Normalkraft \\(N\\) und Reibungskoeffizient müssen zum Kontaktmodell der Aufgabe passen.'],math:'\\[0\\le F_H\\le\\mu_H N,\\qquad F_G=\\mu_G N\\text{ (bei Gleiten)}\\]',source:'Skript MECH WSK1, Kapitel 3; Übungen MECH WSK1.'},
  {group:'Vertiefung',title:'Mehrkörpersysteme & Schnittgrössen',intro:'Bei verbundenen Körpern kann jeder Teilkörper separat freigeschnitten werden. Kräfte an inneren Gelenken erscheinen dabei als Wechselwirkungskräfte mit gleicher Grösse und entgegengesetzter Richtung.',points:['Teilkörper einzeln freischneiden und Verbindungskräfte eintragen.','Für Streckenlasten die resultierende Kraft und ihren Angriffspunkt aus der Lastverteilung bestimmen.','Schnittgrössen hängen von der Lage des betrachteten Schnitts ab.','Die verfügbare Lernheft-Zusammenfassung führt diese Themen als Vertiefung; im Originalskript Teil 1 sind sie nicht vollständig dokumentiert.'],source:'Mechanik_Lernheft_3-4_Stunden.pdf; ergänzend Originalskript Teil 1.'}
 ]},
 {id:'wsk',title:'Werkstoffkunde',short:'Metalle & Prüfung',emoji:'🧱',color:'#b77d39',status:'partial',desc:'Werkstoffaufbau, Verformung, Kennwerte und Prüfverfahren.',sources:['1 m.pdf · Metallkunde','2 m.pdf · Werkstoffprüfung','3 m.pdf–7m.pdf · Kursmaterial vorhanden, Inhaltstitel noch nicht verlässlich erfasst'],topics:[
  {group:'Metallkunde',title:'Kristallstrukturen & Gefüge',intro:'Metalle bestehen meist aus vielen Kristalliten. Die Elementarzelle beschreibt die periodische Anordnung der Atome; Kristallstruktur und Gefüge beeinflussen mechanische Eigenschaften.',points:['Im Skript werden kfz, krz und hexagonal dichteste Packung behandelt.','Miller-Indizes kennzeichnen kristallographische Richtungen und Ebenen.','Polymorphie bedeutet, dass ein Werkstoff je nach Bedingungen verschiedene Kristallstrukturen annehmen kann.','Die Kristallstruktur wirkt sich auf Gleiten und plastische Verformbarkeit aus.'],source:'1 m.pdf, Kapitel 1.1; Inhaltsverzeichnis und Textauszug.'},
  {group:'Metallkunde',title:'Kristallbaufehler & Verfestigung',intro:'Reale Kristalle sind nicht perfekt. Punktdefekte, Versetzungen, Korngrenzen und Ausscheidungen behindern das Gleiten und können so die Festigkeit erhöhen.',points:['0D: punktförmige Defekte und Fremdatome.','1D: Versetzungen; ihre Bewegung ermöglicht plastische Verformung.','2D: Korngrenzen.','Im Skript: Mischkristall-, Kalt-, Feinkorn- und Ausscheidungsverfestigung.'],source:'1 m.pdf, Kapitel 1.2 und 1.6.'},
  {group:'Verformung',title:'Elastisch, plastisch & isotrop',intro:'Elastische Verformung ist reversibel; plastische Verformung bleibt nach Entlastung bestehen. Isotropes Materialmodell nimmt gleiche Eigenschaften in allen Richtungen an.',points:['Im linear-elastischen Bereich gilt das Hooke’sche Gesetz.','Bei Zug: technische Spannung bezogen auf die Ausgangsfläche.','Technische Dehnung bezogen auf die Ausgangslänge.','Einheit der Spannung: \\(\\mathrm{N/mm^2}=\\mathrm{MPa}\\).'],math:'\\[\\sigma=\\frac{F}{A_0},\\qquad \\varepsilon=\\frac{\\Delta L}{L_0},\\qquad \\sigma=E\\varepsilon\\]',source:'1 m.pdf, Kapitel 1.3–1.5; 2 m.pdf, Kapitel 2.1.1.'},
  {group:'Werkstoffprüfung',title:'Zugversuch & Kennwerte',intro:'Beim Zugversuch werden Kraft und Längenänderung einer genormten Probe gemessen. Daraus entsteht ein Spannungs-Dehnungs-Diagramm mit charakteristischen Bereichen.',points:['Elastischer Bereich: Rückkehr zur Ausgangsform nach Entlastung.','Fliessbeginn markiert den Übergang zu bleibender plastischer Verformung.','Zugfestigkeit ist das Maximum der technischen Spannung.','Duktiles Material kann einschnüren und schliesslich brechen.'],source:'2 m.pdf, Kapitel 2.1.1–2.1.2.'},
  {group:'Werkstoffprüfung',title:'Härte, Biegung, Ermüdung & Zähigkeit',intro:'Verschiedene Prüfverfahren erfassen unterschiedliche Beanspruchungen und Versagensarten.',points:['Härteprüfung: Widerstand gegen lokales Eindringen.','Biegeversuch: Verhalten bei Biegebeanspruchung.','Dauerschwingversuch nach Wöhler: Verhalten unter zyklischer Belastung.','Kerbschlagbiegeversuch: Energieaufnahme bei schlagartiger Belastung und Zusammenhang mit Zähigkeit.'],source:'2 m.pdf, Kapitel 2.1.3–2.1.6.'},
  {group:'Werkstoffprüfung',title:'Mikroskopie & Zusammensetzung',intro:'Neben mechanischen Kennwerten lassen sich Gefüge und chemische Zusammensetzung untersuchen.',points:['Stereomikroskopie und konfokale Lasermikroskopie.','XRD, metallographische Lichtmikroskopie, REM, TEM und Computertomographie.','RFA, EDX/WDX, Funkenspektrometrie und FTIR.','Jede Methode liefert andere Informationen und hat andere Probenanforderungen.'],source:'2 m.pdf, Kapitel 2.2–2.4.'}
 ]},
 {id:'math3a',title:'Mathematik 3A',short:'Mehrdimensionale Analysis',emoji:'∿',color:'#6e78bd',status:'good',desc:'Funktionen mehrerer Variablen, Ableitungen, Optimierung und Integration.',sources:['Math3A_W01.pdf–Math3A_W11.pdf · Vorlesungs-/Kontaktstudiumsunterlagen','Formelsammlung_Math3A_Original_mit_Beschriftungen.pdf','Math3A_Uebungen_Formeln_Loesungen_Komplett.pdf','Math3A_Lernheft_Partielle_Ableitungen_Integration.pdf'],topics:[
  {group:'Funktionen mehrerer Variablen',title:'Graphen, Querschnitte & Niveaulinien',intro:'Eine Funktion mit zwei Eingangsgrössen ordnet jedem Punkt \\((x,y)\\) einen Wert \\(z=f(x,y)\\) zu. Man kann sie als Fläche im Raum oder über Niveaulinien darstellen.',points:['Definitionsbereich und Wertebereich beachten.','Querschnitte entstehen, wenn eine Variable festgehalten wird.','Niveaulinien erfüllen \\(f(x,y)=c\\).','Abstand zweier Punkte im Raum mit der erweiterten Distanzformel berechnen.'],math:'\\[z=f(x,y),\\qquad f(x,y)=c,\\qquad d=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}\\]',source:'Math3A Skript, Kapitel 1.1–1.3.'},
  {group:'Differentiation',title:'Partielle Ableitungen',intro:'Bei einer partiellen Ableitung wird nach einer Variablen abgeleitet, während die übrigen Variablen als Konstanten behandelt werden.',points:['\\(f_x\\) beschreibt die lokale Änderungsrate in x-Richtung.','\\(f_y\\) beschreibt die lokale Änderungsrate in y-Richtung.','Einheiten der Ableitung ergeben sich aus Ausgabe- pro Eingabeeinheit.','Am Punkt einsetzen, nachdem abgeleitet wurde.'],math:'\\[f_x(x,y)=\\frac{\\partial f}{\\partial x},\\qquad f_y(x,y)=\\frac{\\partial f}{\\partial y}\\]',example:{q:'Bestimme die partiellen Ableitungen von \\(f(x,y)=x^2y+3y\\) und werte \\(f_x\\) bei \\((2,1)\\) aus.',steps:['Für \\(f_x\\) ist \\(y\\) konstant: \\(f_x=2xy\\).','Für \\(f_y\\) ist \\(x\\) konstant: \\(f_y=x^2+3\\).','Für den Punkt \\((2,1)\\) in \\(f_x\\) einsetzen.'],answer:'\\(f_x(2,1)=2\\cdot2\\cdot1=4\\), und allgemein \\(f_y=x^2+3\\).'},source:'Math3A Skript, Kapitel 2.1–2.2; Übungsheft A1.'},
  {group:'Differentiation',title:'Differential & Tangentialebene',intro:'In einer kleinen Umgebung lässt sich eine differenzierbare Funktion durch eine Ebene annähern. Das totale Differential beschreibt die lineare Änderung aus kleinen Eingangsänderungen.',points:['Tangentialebene am Punkt \\((a,b)\\) verwendet Funktionswert und beide ersten partiellen Ableitungen.','Lokale Linearisierung ist eine Näherung in der Nähe des Entwicklungspunktes.','Das totale Differential sammelt die Beiträge \\(dx\\) und \\(dy\\).'],math:'\\[z\\approx f(a,b)+f_x(a,b)(x-a)+f_y(a,b)(y-b),\\qquad df=f_x\\,dx+f_y\\,dy\\]',source:'Math3A Skript, Kapitel 2.4; Lernheft Partielle Ableitungen.'},
  {group:'Differentiation',title:'Gradient & Richtungsableitung',intro:'Der Gradient sammelt die partiellen Ableitungen als Vektor. Er zeigt in Richtung des stärksten lokalen Anstiegs; die Richtungsableitung misst die Änderung in einer vorgegebenen Einheitsrichtung.',points:['Gradient in zwei Variablen: \\(\\nabla f=(f_x,f_y)\\).','Richtungsvektor vor der Verwendung normieren.','Richtungsableitung als Skalarprodukt aus Gradient und Einheitsrichtung.','Gradient steht senkrecht auf einer glatten Niveaukurve.'],math:'\\[\\nabla f=(f_x,f_y),\\qquad D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u,\\quad \\|\\mathbf u\\|=1\\]',source:'Math3A Skript, Kapitel 2.5–2.8.'},
  {group:'Optimierung',title:'Kritische Punkte & Extrema',intro:'Innere lokale Extremstellen einer differenzierbaren Funktion liegen unter den üblichen Voraussetzungen bei kritischen Punkten, an denen der Gradient verschwindet.',points:['Gleichungen \\(f_x=0\\) und \\(f_y=0\\) lösen.','Kandidaten mit der zweiten Ableitungsmatrix klassifizieren.','Sattelpunkt, lokales Minimum und lokales Maximum unterscheiden.','Rand und Definitionsbereich bei globalen Extrema separat prüfen.'],math:'\\[\\nabla f=\\mathbf 0,\\qquad D=f_{xx}f_{yy}-(f_{xy})^2\\]',source:'Math3A Skript, Kapitel 3.1; Übungsheft.'},
  {group:'Optimierung',title:'Lagrange-Multiplikatoren',intro:'Bei einer Gleichungsnebenbedingung werden Kandidaten gesucht, bei denen der Gradient der Zielfunktion parallel zum Gradienten der Nebenbedingung ist.',points:['Zielgrösse und Nebenbedingung klar benennen.','Gleichungssystem \\(\\nabla f=\\lambda\\nabla g\\) zusammen mit \\(g=c\\) lösen.','Kandidaten in die Zielgrösse einsetzen und vergleichen.','Randbedingungen und Zulässigkeit prüfen.'],math:'\\[\\nabla f(x,y)=\\lambda\\nabla g(x,y),\\qquad g(x,y)=c\\]',source:'Math3A Skript, Kapitel 3.2.'},
  {group:'Integration',title:'Doppel- & iterierte Integrale',intro:'Ein Doppelintegral summiert Funktionswerte über ein Gebiet. Je nach Funktion und Interpretation kann es Volumen, Fläche, Gesamtmenge oder Mittelwert liefern.',points:['Bei rechteckigen Gebieten Grenzen der beiden Variablen klar angeben.','Iterierte Integrale nacheinander auswerten.','Bei nicht rechteckigen Gebieten innere Grenzen können von der äusseren Variablen abhängen.','Integrationsreihenfolge nur mit korrekt umgeschriebenem Gebiet vertauschen.'],math:'\\[\\iint_D f(x,y)\\,dA=\\int_a^b\\!\\int_{g_1(x)}^{g_2(x)}f(x,y)\\,dy\\,dx\\]',source:'Math3A Skript, Kapitel 4.1–4.2; Serie 10.'},
  {group:'Integration',title:'Polar-, Zylinder- & Dreifachintegrale',intro:'Für kreisförmige oder rotationssymmetrische Gebiete vereinfachen Polarkoordinaten die Beschreibung. Bei Koordinatenwechseln muss das Flächenelement beziehungsweise Volumenelement mittransformiert werden.',points:['Polar: \\(x=r\\cos\\theta\\), \\(y=r\\sin\\theta\\), \\(dA=r\\,dr\\,d\\theta\\).','Dreifachintegrale summieren über ein Volumen.','Zylinderkoordinaten erweitern Polar- um eine Höhenkoordinate.','Diese Themen erscheinen in den bereitgestellten älteren Kursunterlagen; ihr aktueller Prüfungsumfang ist nicht bestätigt.'],math:'\\[dA=r\\,dr\\,d\\theta,\\qquad dV=r\\,dr\\,d\\theta\\,dz\\]',source:'Math3A Skript, Kapitel 4.3–4.5; Material SW10–SW11.'}
 ]},
 {id:'linalg',title:'Lineare Algebra',short:'Vektoren & Matrizen',emoji:'▦',color:'#527ea5',status:'good',desc:'Vektorgeometrie, Gleichungssysteme, Matrizen, Unterräume und Eigenwerte.',sources:['Linalg16.pdf · HSLU-Skript, Ausgabe 11.09.2026','Linalg 1.pdf–Linalg16.pdf · einzelne Kurseinheiten/Unterlagen','Linalg_Alte_Mep_Lsg_ZF - Kopie.pdf · in Zellbio-Ordner abgelegt, Zuordnung unsicher'],topics:[
  {group:'Vektoren',title:'Vektoren & Koordinaten',intro:'Vektoren beschreiben gerichtete Grössen. In Koordinaten lassen sie sich komponentenweise addieren und mit Skalaren multiplizieren.',points:['Betrag in zwei Dimensionen mit Pythagoras bestimmen.','Ortsvektor und Verbindungsvektor unterscheiden.','Vektoraddition geometrisch als Spitze-an-Schaft oder komponentenweise.','Skript nennt Anwendungen in Tragwerken und weiteren technischen Systemen.'],math:'\\[\\mathbf v=\\begin{pmatrix}v_1\\\\v_2\\end{pmatrix},\\qquad \\|\\mathbf v\\|=\\sqrt{v_1^2+v_2^2}\\]',source:'Linalg16, Kapitel 1.1, 3.1–3.2.'},
  {group:'Vektoren',title:'Skalarprodukt & Winkel',intro:'Das Skalarprodukt zweier Vektoren ist eine Zahl. Es verbindet die Komponentenrechnung mit Winkel und Orthogonalität.',points:['Komponenten multiplizieren und addieren.','Bei nichtverschwindenden Vektoren gilt \\(\\mathbf u\\cdot\\mathbf v=0\\) genau dann, wenn sie orthogonal sind.','Der Winkel folgt aus dem Kosinus-Zusammenhang.'],math:'\\[\\mathbf u\\cdot\\mathbf v=\\sum_{i=1}^{n}u_iv_i=\\|\\mathbf u\\|\\,\\|\\mathbf v\\|\\cos\\varphi\\]',source:'Linalg16, Kapitel 3.3 und 11.1–11.3.'},
  {group:'Vektoren',title:'Vektorprodukt',intro:'Im dreidimensionalen Raum ergibt das Kreuzprodukt einen Vektor, der auf beiden Eingangsvektoren senkrecht steht.',points:['Richtung mit der Rechte-Hand-Regel bestimmen.','Betrag entspricht der Fläche des aufgespannten Parallelogramms.','Reihenfolge tauschen kehrt die Richtung um.'],math:'\\[\\|\\mathbf u\\times\\mathbf v\\|=\\|\\mathbf u\\|\\,\\|\\mathbf v\\|\\sin\\varphi\\]',source:'Linalg16, Kapitel 3.4.'},
  {group:'Gleichungssysteme',title:'Gaußsches Eliminationsverfahren',intro:'Elementare Zeilenumformungen führen ein lineares Gleichungssystem in eine Stufenform. Rückwärtseinsetzen liefert anschliessend die Lösung.',points:['Erweiterte Matrix aufstellen.','Zulässige Zeilenoperationen anwenden.','Widerspruchszeilen und freie Variablen erkennen.','Lösung durch Einsetzen prüfen.'],math:'\\[\\begin{pmatrix}2&1&|&5\\\\1&-1&|&1\\end{pmatrix}\\;\\longrightarrow\\;\\begin{cases}2x+y=5\\\\x-y=1\\end{cases}\\]',example:{q:'Löse \\(2x+y=5\\) und \\(x-y=1\\).',steps:['Gleichungen addieren: \\(3x=6\\).','Damit \\(x=2\\).','In \\(x-y=1\\) einsetzen.'],answer:'\\(x=2,\;y=1\\). Probe: \\(2\\cdot2+1=5\\) und \\(2-1=1\\).'},source:'Linalg16, Kapitel 4.1–4.3.'},
  {group:'Matrizen',title:'Matrizen & Operationen',intro:'Eine Matrix ist ein rechteckiges Zahlenschema. Sie kann lineare Gleichungssysteme und lineare Abbildungen kompakt darstellen.',points:['Dimensionen beachten; die Spaltenzahl der linken Matrix muss zur Zeilenzahl der rechten passen.','Matrixaddition ist komponentenweise.','Matrixmultiplikation ist im Allgemeinen nicht vertauschbar.','Im Skript kommen Python-Operationen mit NumPy hinzu.'],math:'\\[A\\in\\mathbb R^{m\\times n},\\qquad (AB)_{ij}=\\sum_k a_{ik}b_{kj}\\]',source:'Linalg16, Kapitel 5.'},
  {group:'Matrizen',title:'Inverse & Determinante',intro:'Eine quadratische Matrix ist genau dann invertierbar, wenn ihre Determinante ungleich null ist. Die Inverse löst dann \\(A\\mathbf x=\\mathbf b\\) über \\(\\mathbf x=A^{-1}\\mathbf b\\).',points:['Inverse nur für quadratische Matrizen definieren.','Bei \\(\\det(A)=0\\) existiert keine Inverse.','Determinante auch als orientierter Flächen- oder Volumenfaktor interpretieren.','Für numerische Berechnungen sind direkte Solver meist robuster als explizites Invertieren.'],math:'\\[A\\mathbf x=\\mathbf b,\\qquad \\det(A)\\ne0\\;\\Longrightarrow\\;\\mathbf x=A^{-1}\\mathbf b\\]',source:'Linalg16, Kapitel 6–7; 12.'},
  {group:'Vektorräume',title:'Unterräume, Basis & Dimension',intro:'Ein linearer Unterraum enthält den Nullvektor und ist unter Addition und Skalarmultiplikation abgeschlossen. Eine Basis ist ein linear unabhängiges Erzeugendensystem.',points:['Lineare Unabhängigkeit über die Gleichung der Linearkombination prüfen.','Basisvektoren spannen den ganzen Unterraum auf.','Die Dimension ist die Anzahl der Basisvektoren.','Affine Unterräume sind verschobene lineare Unterräume und müssen den Nullpunkt nicht enthalten.'],math:'\\[U\\le\\mathbb R^n\\iff\\mathbf 0\\in U,\\;u,v\\in U\\Rightarrow u+v\\in U,\\;\\lambda u\\in U\\]',source:'Linalg16, Kapitel 8.'},
  {group:'Abbildungen & Eigenwerte',title:'Lineare Abbildungen',intro:'Eine lineare Abbildung erhält Vektoraddition und Skalarmultiplikation. In endlichen Dimensionen wird sie bezüglich gewählter Basen durch eine Matrix dargestellt.',points:['Bild und Kern einer Abbildung beschreiben.','Matrix einer Abbildung über die Bilder der Basisvektoren bestimmen.','Invertierbarkeit der Abbildung mit Rang beziehungsweise Kern verknüpfen.','Affine Abbildungen ergänzen eine lineare Abbildung um eine Verschiebung.'],source:'Linalg16, Kapitel 9.'},
  {group:'Abbildungen & Eigenwerte',title:'Eigenwerte & Diagonalisierung',intro:'Ein Eigenvektor ändert unter einer linearen Abbildung seine Richtung nicht; nur sein Faktor, der Eigenwert, ändert sich.',points:['Gleichung \\(A v=\\lambda v\\) umstellen zu \\((A-\\lambda I)v=0\\).','Eigenwerte aus der charakteristischen Gleichung bestimmen.','Zu jedem Eigenwert den Eigenraum berechnen.','Diagonalisierung ist nur möglich, wenn genug linear unabhängige Eigenvektoren existieren.'],math:'\\[A\\mathbf v=\\lambda\\mathbf v,\\qquad \\det(A-\\lambda I)=0\\]',source:'Linalg16, Kapitel 10.'},
  {group:'Orthogonalität & numerik',title:'Normen, Projektion & Gram–Schmidt',intro:'Normen messen Vektorlängen. Orthogonale Projektionen zerlegen einen Vektor in einen Anteil im Unterraum und einen dazu senkrechten Anteil.',points:['Orthonormalbasis: paarweise orthogonal und jeder Vektor normiert.','Projektion auf eine Orthonormalbasis als Summe der Komponenten berechnen.','Gram–Schmidt erzeugt aus unabhängigen Vektoren eine Orthonormalbasis desselben Unterraums.','Im Skript folgen Spektralsatz und Python-Beispiele.'],math:'\\[\\operatorname{proj}_U(v)=\\sum_{i=1}^{k}(v\\cdot b_i)b_i\\quad\\text{für eine Orthonormalbasis }(b_i)\\]',source:'Linalg16, Kapitel 11.'},
  {group:'Orthogonalität & numerik',title:'Lineare Systeme mit Python & SVD',intro:'Das HSLU-Skript behandelt numerische Lösung linearer Gleichungssysteme mit Python sowie die Singulärwertzerlegung.',points:['Quadratische reguläre, singuläre und nicht quadratische Systeme unterscheiden.','Im Skript: NumPy und SciPy für numerische Lösungsverfahren.','Singulärwertzerlegung gilt auch für rechteckige Matrizen.','Python-Kommandos sind ergänzend zum mathematischen Verständnis zu lesen.'],math:'\\[A=U\\Sigma V^{\mathsf T}\\]',source:'Linalg16, Kapitel 12 und Anhang A.'}
 ]},
 {id:'python',title:'Python Basics',short:'Programmieren',emoji:'⌘',color:'#4f84aa',status:'partial',desc:'Syntax, Bedingungen, Schleifen, Listen, Dictionaries, Funktionen und Tests.',sources:['Python_Spickzettel_Tabellenstil_8_Seiten.pdf · SW01–SW02 und weitere Grundlagen','Python_SW06_ProgressCheck_Aufgaben_Loesungen.pdf · ProgressCheck SW06','Zusammenfassung für Testat 3 · HS2025 (älterer Stand)'],topics:[
  {group:'Grundlagen',title:'Variablen, Typen & Ein-/Ausgabe',intro:'Variablen speichern Werte. Python unterscheidet unter anderem Zahlen, Zeichenketten und Wahrheitswerte; Namen sind gross-/kleinschreibungssensitiv.',points:['Zuweisung mit \\(=\\), Vergleich mit \\(==\\).','\\(input()\\) liefert zunächst eine Zeichenkette.','Umwandlungen explizit mit \\(int()\\), \\(float()\\) oder \\(str()\\).','\\(print()\\) zeigt etwas an, speichert aber nicht automatisch das Ergebnis.'],example:{q:'Was ist der Unterschied zwischen \\(=\\) und \\(==\\)?',steps:['In \\(x=3\\) erhält die Variable x den Wert 3.','In \\(x==3\\) wird geprüft, ob x gleich 3 ist.'],answer:'\\(=\\) weist zu; \\(==\\) vergleicht und ergibt einen Wahrheitswert.'},source:'Python-Spickzettel, Seiten 1–2.'},
  {group:'Kontrollfluss',title:'Bedingungen: if / elif / else',intro:'Bedingungen steuern, welche Codezeilen ausgeführt werden. Python führt bei einer if/elif/else-Kette den ersten zutreffenden Zweig aus.',points:['Nach \\(if\\), \\(elif\\) und \\(else\\) steht ein Doppelpunkt.','Der eingerückte Block gehört zur Bedingung.','Grenzfälle mit < oder <= bewusst unterscheiden.','Geforderte Ergebnisse in den verlangten Variablen speichern.'],example:{q:'Taxifahrt: Grundtaxe 6.50 CHF, 3.80 CHF pro km, 12.4 km. Unter 30 günstig, unter 60 mittel, sonst teuer.',steps:['Preis: \\(6.50+12.4\\cdot3.80\\).','Bei 1 Nachkommastelle runden.','Die passende Preisstufe mit einer if/elif/else-Kette zuweisen.'],answer:'Preis rechnerisch 53.62 CHF, gerundet 53.6 CHF; Stufe «mittel». SW06-Lösung nutzt diese Werte.'},source:'Python_SW06 ProgressCheck, Aufgabe 1.'},
  {group:'Kontrollfluss',title:'for-Schleifen & range',intro:'Eine for-Schleife führt einen Block für jedes Element einer Folge aus. Mit \\(range(len(liste))\\) kann über gültige Indizes iteriert werden.',points:['Der erste Listenindex ist 0.','\\(range(n)\\) liefert 0 bis \\(n-1\\).','Bei einem Index immer den einzelnen Listenwert verwenden, zum Beispiel \\(liste[i]\\).','Bei einer Schleife über Werte ist \\(for\;wert\;in\;liste\\) oft lesbarer.'],source:'Python-Spickzettel, Schleifen; SW06 ProgressCheck, Aufgabe 2.'},
  {group:'Datenstrukturen',title:'Listen, Slices & Methoden',intro:'Listen speichern geordnete Werte. Ein Slice wählt einen Ausschnitt; Methoden wie \\(append()\\) fügen Elemente hinzu.',points:['Grenzen von Slices: Start ist dabei, Stop nicht.','\\(liste[i]\\) greift auf ein Element zu.','\\(append(x)\\) verändert die Liste.','\\(sum()\\) summiert Zahlen; \\(len()\\) zählt Elemente.'],source:'Python-Spickzettel, Listen und Folgen.'},
  {group:'Datenstrukturen',title:'Dictionaries & Sets',intro:'Ein Dictionary ordnet Schlüssel Werten zu; ein Set enthält eindeutige Elemente ohne garantierte Reihenfolge.',points:['Leeres Dictionary: \\({}\\).','Zuordnung: \\(d[key]=value\\).','\\(set(liste)\\) entfernt Dubletten.','Die angezeigte Reihenfolge eines Sets nicht als stabil voraussetzen.'],source:'Python_SW06 ProgressCheck, Aufgabe 3.'},
  {group:'Funktionen & Qualität',title:'Funktionen & Fehlersuche',intro:'Funktionen bündeln wiederverwendbare Anweisungen. Fehlermeldungen helfen, den Fehler einzugrenzen; häufige Ursachen sind falsche Namen, Typen oder Einrückungen.',points:['Funktion mit \\(def\\) und Doppelpunkt beginnen.','Parameter lokal verwenden und Rückgabewert mit \\(return\\) liefern, wenn gefordert.','Automatische Tests kontrollieren oft exakte Variablennamen und Rückgabewerte.','SyntaxError, NameError und TypeError unterscheiden.'],source:'Python-Spickzettel; Zusammenfassung Testat 3, älterer Stand.'}
 ]},
 {id:'zellbio',title:'Zellbiologie',short:'Zelle & Biomoleküle',emoji:'◉',color:'#558b75',status:'partial',desc:'Zellaufbau, Membran, Wasser, Biomoleküle, Proteine und Informationsfluss.',sources:['Zellbiologie_SW1_Lernzusammenfassung.pdf · Biomoleküle 1','ilias.php.pdf · Zellaufbau 1 · 01.09.2026','ilias.php 2.pdf · Einführung und Biomoleküle 2 · HS26'],topics:[
  {group:'Zelle & Chemie',title:'Zellorganisation & Organellen',intro:'Die Zelle ist die grundlegende Bau- und Funktionseinheit. Zellmembran, Zytoplasma, Organellen und Zellkern übernehmen unterschiedliche Aufgaben.',points:['Organisation: Zelle → Gewebe → Organ → Organsystem → Organismus.','Zytosol ist wässriger Reaktionsraum und Transportmedium.','Organellen trennen Reaktionsräume und ermöglichen spezialisierte Funktionen.','Kernhülle umgibt die DNA-haltige Kernregion; Kernporen ermöglichen Stoffaustausch.'],source:'Zellbiologie SW1 Lernzusammenfassung; Zellaufbau 1, Folien 4–16.'},
  {group:'Zelle & Chemie',title:'Membran & Stofftransport',intro:'Die Zellmembran ist eine dynamische Phospholipid-Doppelschicht mit eingelagerten und angelagerten Proteinen. Ihr Aufbau trägt zur selektiven Durchlässigkeit bei.',points:['Hydrophile Köpfe zeigen zum wässrigen Innen- und Aussenraum.','Hydrophobe Fettsäureketten liegen einander zugewandt im Inneren.','Membranproteine können Transport, Signalaufnahme, Katalyse oder Verankerung übernehmen.','Kursfolien nennen passiven und aktiven Transport sowie Zellkontakte; genaue Mechanismen anhand der vollständigen Vorlesungsfolien vertiefen.'],source:'Zellaufbau 1, Folien 7–15.'},
  {group:'Zelle & Chemie',title:'Bindungen, Polarität & Wasser',intro:'Die Verteilung von Elektronen bestimmt Polarität und Wechselwirkungen. Wasser ist wegen seiner gewinkelten Struktur ein Dipol und stabilisiert geladene Teilchen durch Hydrathüllen.',points:['Kovalente Bindungen teilen Elektronenpaare; Ionenbindungen beruhen auf Anziehung geladener Ionen.','Polare Bindungen machen nicht automatisch jedes ganze Molekül zum Dipol: die räumliche Form zählt.','Wasserstoffbrücken sind gerichtete zwischenmolekulare Wechselwirkungen.','Faustregel aus dem Lernheft: Ähnliches löst sich in Ähnlichem.'],source:'Zellbiologie SW1 Lernzusammenfassung, Kapitel 2–4.'},
  {group:'Biomoleküle',title:'Kohlenhydrate, Lipide & Aminosäuren',intro:'Biologische Makromoleküle entstehen aus kleineren Bausteinen. Struktur und Polarität beeinflussen Löslichkeit und Funktion.',points:['Zuckerbausteine können zu Polysacchariden verknüpft werden.','Fettsäuren und weitere Bausteine bilden Lipide; unpolare Ketten sind lipophil.','Aminosäuren unterscheiden sich unter anderem durch ihre Seitenketten.','Aminosäuren werden über Peptidbindungen zu Peptiden und Proteinen verknüpft.'],source:'Zellbiologie SW1 Lernzusammenfassung; Biomoleküle 1 Folien.'},
  {group:'Biomoleküle',title:'Proteine & Enzyme',intro:'Die Aminosäuresequenz bildet die Primärstruktur eines Proteins. Wechselwirkungen stabilisieren weitere Strukturebenen; die 3D-Form ist wichtig für die Funktion.',points:['Strukturebenen: Primär-, Sekundär-, Tertiär- und Quartärstruktur.','Denaturierung verändert die räumliche Struktur und kann die Funktion beeinträchtigen.','Enzyme sind Biokatalysatoren und senken die Aktivierungsenergie.','Substratspezifität hängt mit Eigenschaften des aktiven Zentrums zusammen; einige Enzyme benötigen Coenzyme.'],source:'ilias.php 2.pdf, Folien 5–20.'},
  {group:'Biomoleküle',title:'DNA, RNA, ATP & NAD',intro:'Nukleinsäuren speichern und vermitteln biologische Information. ATP und NAD übernehmen wichtige Übertragungsfunktionen in zellulären Reaktionen.',points:['Ein Nukleotid enthält Zucker, Phosphatgruppe und stickstoffhaltige Base.','DNA und RNA unterscheiden sich in Bausteinen und typischen Funktionen.','Vereinfachter Informationsfluss: DNA → RNA → Protein.','ATP ist ein Energieüberträger; NAD⁺/NADH ist an Elektronenübertragungen beteiligt.'],source:'ilias.php 2.pdf, Folien 21–30.'}
 ]},
 {id:'cad',title:'CAD + Simulation',short:'SolidWorks & 3DExperience',emoji:'◇',color:'#bd6a5e',status:'good',desc:'Modellieren, Baugruppen, Zeichnungen, Blechteile, Oberflächen und Simulation.',sources:['Cad Organisation .pdf · Modul CAD_SIM HS26','Plan cad.pdf · Semesterübersicht CAD_SIM HS2601'],topics:[
  {group:'Start & Teile',title:'CAD-Grundlagen & Skizzen',intro:'Der CAD-Modulplan beginnt mit Einführung, Benutzeroberfläche und Skizzen in SolidWorks 2025.',points:['Modellabsicht vor dem Skizzieren festlegen.','Skizzenbeziehungen und Masse so setzen, dass die Skizze eindeutig bestimmt ist.','Dateien vor dem Arbeiten aus ZIP-Ordnern entpacken.','Der Modulplan empfiehlt regelmässiges praktisches Üben.'],source:'Plan cad.pdf, SW1; Cad Organisation, Informationen zum Unterricht.'},
  {group:'Start & Teile',title:'Volumenmodellierung & Features',intro:'Einzelteile entstehen aus Skizzen und Features. Im Modulplan folgen Volumenmodellierung, Bohrungsassistent und Import/Export.',points:['SW2: Volumenmodellierung und Hole Wizard.','SW3: Verrundungen, Schale, Rippen, Entformung, Mehrkörper und Material.','Features sinnvoll benennen und ihre Abhängigkeiten nachvollziehbar halten.','Nur die im Unterricht behandelten und im ILIAS-Material aufgeführten Werkzeuge gehören laut Organisation in die Prüfung.'],source:'Plan cad.pdf, SW2–SW3; Cad Organisation, Prüfungsbedingungen.'},
  {group:'Zeichnung & Baugruppe',title:'Technische Zeichnungen',intro:'Zeichnungen leiten Ansichten und Masse aus einem Teil oder einer Baugruppe ab und dokumentieren die Konstruktion.',points:['SW4: Zeichnungen aus Einzelteilen erstellen und formatieren.','Ansichten und Bemaßungen lesbar und eindeutig anordnen.','Dokumentation soll zum Modell passen.'],source:'Plan cad.pdf, SW4; Modulkompetenzen CAD_SIM.'},
  {group:'Zeichnung & Baugruppe',title:'Baugruppen & Verknüpfungen',intro:'Baugruppen verbinden Einzelteile über Verknüpfungen. Der Plan umfasst Unterbaugruppen, Interferenzprüfung und Explosionsansichten.',points:['SW5: Top-down- und Bottom-up-Aufbau, Mates, Subassemblies.','SW6: fortgeschrittene Mates, In-Context-Komponenten, Riemenmechanismus, Exploded Views und Pack & Go.','SW7: Gesamtbaugruppen und FeatureWorks.','Interferenztest nutzen, um Überschneidungen zu prüfen.'],source:'Plan cad.pdf, SW5–SW7.'},
  {group:'Vertiefung',title:'Blech, komplexe Teile & Oberflächen',intro:'Die zweite Semesterhälfte erweitert die Konstruktion um Blech, komplexe Bauteile und Freiformflächen.',points:['SW9: Base Flange, Blechumwandlung, Abwicklung und Blechzeichnung.','SW10: Konfigurationen, 3D-Skizzen, Schweisskonstruktionen sowie Volumen berechnen/kombinieren.','SW11: Oberflächen und Lofted Surfaces.','SW12: Sub-D-Modellierung und xShape/3DExperience.'],source:'Plan cad.pdf, SW9–SW12.'},
  {group:'Vertiefung',title:'Visualisierung, Bewegung & Simulation',intro:'Zum Semesterende behandelt der Modulplan Visualisierung, Motion-Animation, Simulation, Kostenschätzung und Nachhaltigkeit.',points:['SW13: Erscheinungsbilder, Szenen, Decals, Kameras und Visualize-Rendering.','SW14: Kinematikblöcke, Motion-Animation, Kostenschätzung und Nachhaltigkeit.','Prüfungen: benotete Zwischenprüfung (20% Endnote) und praktische MEP.','MEP gemäss Organisation: etwa zwei Stunden; nur im Unterricht behandelte Werkzeuge.'],source:'Plan cad.pdf, SW13–SW14; Cad Organisation, Prüfungsinformationen.'}
 ]},
 {id:'physik',title:'Physik 2 · Wärme',short:'Gase & Thermodynamik',emoji:'🌡️',color:'#d08045',status:'limited',desc:'Aus den vorhandenen Bildern: kinetische Gastheorie, Gasgesetze und Wärmeprozesse.',sources:['6 Bilder im Ordner Physik 2 · Aufgaben/Screenshots zu Wärme und Gasen','Themenumfang nur aus diesen Bildern abgeleitet; vollständiges Skript/Formelsammlung nicht gefunden'],topics:[
  {group:'Gase',title:'Ideales Gas & Stoffmenge',intro:'Die vorhandenen Physik-2-Bilder zeigen Aufgaben zum idealen Gas, zu Molmassen und zur Stoffmenge. Für Zustandsänderungen müssen Temperatur stets in Kelvin und Einheiten konsistent eingesetzt werden.',points:['Zustandsgleichung: Druck mal Volumen hängt von Stoffmenge und absoluter Temperatur ab.','Für Gasmischungen können Partialdrücke und Stoffmengenanteile relevant sein.','Molare Masse und Teilchenmasse nicht verwechseln.','In den Bildern wird für Normbedingungen 0 °C und 1 atm ein Molvolumen von rund 22.4 L verwendet.'],math:'\\[pV=nRT,\\qquad T[\\mathrm K]=T[ ^\\circ\\mathrm C]+273.15\\]',source:'Physik-2-Bilder IMG_2222/IMG_2224 und 0EF62… · OCR der sichtbaren Aufgaben.'},
  {group:'Gase',title:'Zustandsänderungen & Gasgesetze',intro:'Für eine feste Gasmenge folgt aus dem idealen Gasgesetz eine Beziehung zwischen Druck, Volumen und absoluter Temperatur. Je nach Prozess bleibt eine Grösse konstant.',points:['Isotherm: Temperatur konstant.','Isobar: Druck konstant.','Isochor: Volumen konstant.','Für schnelle Kompression kann die Aufgabenstellung einen adiabatischen Prozess ohne Wärmeaustausch annehmen.'],math:'\\[\\frac{p_1V_1}{T_1}=\\frac{p_2V_2}{T_2}\\quad(n\\text{ konstant})\\]',source:'Physik-2-Bilder 090709… und IMG_2222; Aufgabenformulierungen.'},
  {group:'Wärme & Arbeit',title:'Isotherme Kompression',intro:'Bei einer isothermen Zustandsänderung eines idealen Gases bleibt die innere Energie konstant, weil sie nur von der Temperatur abhängt. Die Arbeit hängt logarithmisch vom Volumenverhältnis ab.',points:['Vorzeichenkonvention im Aufgabenblatt beachten: Arbeit am Gas ist positiv.','Bei Kompression ist \\(V_2<V_1\\) und \\(p_2>p_1\\).','Für denselben isothermen Prozess gilt \\(p_1V_1=p_2V_2\\).'],math:'\\[W_{\\mathrm{am\ Gas}}=nRT\\ln\\!\\left(\\frac{V_1}{V_2}\\right)=nRT\\ln\\!\\left(\\frac{p_2}{p_1}\\right)\\]',example:{q:'Im Bild: \\(n=0.305\\,\\mathrm{mol}\\), \\(T=22.0^\\circ\\mathrm C\\), isotherme Kompression; Arbeit am Gas 518 J, Enddruck 1.76 atm. Anfangsdruck?',steps:['Temperatur in Kelvin: \\(T=295.15\\,\\mathrm K\\).','\\(W=nRT\\ln(p_2/p_1)\\).','Nach \\(p_1\\) umstellen.'],answer:'\\(p_1=p_2\\exp[-W/(nRT)]\\approx0.88\\,\\mathrm{atm}\\), wie im Aufgabenbild angegeben.'},source:'Physik-2-Bild IMG_2222; sichtbare Aufgabe 22 samt Lösung.'},
  {group:'Wärme & Arbeit',title:'Adiabatische Kompression & Wärmekraftmaschine',intro:'Eine adiabatische Kompression findet ohne Wärmeaustausch statt. Weitere vorhandene Bilder fragen nach Wirkungsgrad, abgeführter Wärme und Leistung eines Motors.',points:['Für ein ideales Gas bei reversibler adiabatischer Zustandsänderung: \\(pV^\\gamma=\\mathrm{konstant}\\).','Wirkungsgrad einer Wärmekraftmaschine: Nutzarbeit geteilt durch zugeführte Wärme.','Energiebilanz im Zyklus: zugeführte Wärme verteilt sich auf Arbeit und abgeführte Wärme.','Die Bilder nennen als Beispiel 10 kJ Wärmeaufnahme und 2 kJ Arbeit pro Zyklus.'],math:'\\[pV^\\gamma=\\mathrm{konstant},\\qquad T_2=T_1\\left(\\frac{p_2}{p_1}\\right)^{(\\gamma-1)/\\gamma},\\qquad \\eta=\\frac{W_{\\mathrm{nutz}}}{Q_{\\mathrm{zu}}}\\]',source:'Physik-2-Bilder 090709… und DD1F…; OCR sichtbarer Aufgaben und Resultate.'}
 ]},
 {id:'ddt',title:'DDT · Digital Design Tools',short:'Photoshop & Bildaufbau',emoji:'▧',color:'#8f6ea1',status:'limited',desc:'Projektbereich zur Photoshop-Sprintmontage; allgemeiner DDT-Unterrichtsstoff ist nicht vollständig vorhanden.',sources:['DDT-PS_Portmann-Luca_Test1.jpg · abgegebenes Arbeitsergebnis','Projektangaben aus den bisherigen DDT-Schritten; kein vollständiges DDT-Skript oder Aufgabenblatt im Quellenordner'],topics:[
  {group:'Photoshop-Projekt',title:'Sprintmontage · Aufbau',intro:'Der sichtbare DDT-Projektkontext ist eine Sprintstart-Montage aus mehreren Aufnahmen. Die App fasst nur die dazu dokumentierten Arbeitsschritte und Abgabevorgaben zusammen.',points:['Mehrere Posen als getrennte Ebenen organisieren.','Personen mit Ebenenmaske freistellen, damit Korrekturen reversibel bleiben.','Hintergrund und Lichtwirkung auf die freigestellten Ebenen abstimmen.','Ebenen sinnvoll benennen und das Ergebnis als PSD erhalten.'],source:'Projektkontext DDT Photoshop Test 1; vorhandenes Ergebnisbild im DDT-Ordner.'},
  {group:'Photoshop-Projekt',title:'Dokument & Export',intro:'Die dokumentierten Vorgaben für das Sprintbild betreffen Pixelmasse, Seitenverhältnis und Abgabeformate.',points:['Endformat: 2880 × 1800 px, Verhältnis 16:10, 72 ppi.','Abgabe: PSD plus JPG mit Qualität 80%.','Die Bilder der einzelnen Posen dürfen von der Endgrösse abweichen.','Aktuelle Vorgaben vor Abgabe nochmals mit dem originalen Aufgabenblatt vergleichen; dieses liegt hier nicht vor.'],source:'Im bisherigen DDT-Projekt dokumentierte Vorgaben; Original-Aufgabenblatt nicht im Ordner gefunden.'}
 ]}

const app=document.getElementById('app'), nav=document.getElementById('courseNav'), search=document.getElementById('search');
let activeCourse=null,activeTopic=null,query='';
const saved=JSON.parse(localStorage.getItem('hslu-lernraum-saved')||'[]');
const done=JSON.parse(localStorage.getItem('hslu-lernraum-done')||'[]');
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusBadge(c){return c.status==='good'?'<span class="pill ok">● Quellen gut abgedeckt</span>':c.status==='partial'?'<span class="pill warn">● Quellen teilweise</span>':'<span class="pill limited">● Quellenlage dünn</span>'}
function allTopics(){return COURSES.flatMap(c=>c.topics.map((t,i)=>({...t,course:c,idx:i})))}
function renderNav(){nav.innerHTML=COURSES.map(c=>`<button class="navitem ${activeCourse===c.id?'active':''}" data-course="${c.id}"><span class="navico">${c.emoji}</span>${c.title}<span class="navcount">${c.topics.length}</span></button>`).join('')+`<button class="navitem ${activeCourse==='sources'?'active':''}" data-course="sources"><span class="navico">⌑</span>Quellenübersicht</button>`;nav.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course))}
function hero(title,sub,eyebrow='DEIN LERNRAUM',side=''){return `<div class="hero"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${side?`<div class="hero-side">${side}</div>`:''}</div>`}
function renderHome(){activeCourse=null;activeTopic=null;renderNav();const total=COURSES.reduce((n,c)=>n+c.topics.length,0);const marked=done.length;app.innerHTML=hero('Schnell finden. Klar verstehen.','Wähle ein Fach oder suche direkt nach einem Begriff. Mathematische Ausdrücke werden im Satzbild gerendert; Beispiele lassen sich Schritt für Schritt aufklappen.','HSLU · MEDIZINTECHNIK',`${marked} von ${total} Themen besucht`)+`<div class="statline"><span class="pill">${COURSES.length} Fächer</span><span class="pill">${total} Themenbereiche</span><span class="pill">Fortschritt nur auf diesem Gerät gespeichert</span></div><div class="sectionlabel"><h2>Fächer</h2><span>nach deinen verfügbaren Kursquellen</span></div><div class="course-grid">${COURSES.map(c=>`<button class="course-card" data-course="${c.id}" style="--tone:${c.color}"><div class="cardtop"><span class="course-emoji">${c.emoji}</span><span class="pill ${c.status==='good'?'ok':c.status==='partial'?'warn':'limited'}">${c.status==='good'?'gut':c.status==='partial'?'teilweise':'begrenzt'}</span></div><h3>${c.title}</h3><p>${c.desc}</p><div class="cardmeta"><span>${c.topics.length} Themen</span><span>${done.filter(x=>x.startsWith(c.id+':')).length} besucht →</span></div></button>`).join('')}</div><div class="sectionlabel"><h2>Zu den Quellen</h2><span>prüfe den Stand pro Fach</span></div><div class="note">Die Themenübersicht folgt den Dateien, die in deinem Kursmaterial verfügbar waren. Bei Fächern mit wenigen oder älteren Dateien ist der Umfang ausdrücklich markiert. Die App stellt solche Bereiche nicht als vollständig bestätigte Prüfungsinhalte dar.</div>`;app.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course));typeset()}
function openCourse(id){if(id==='sources'){activeCourse='sources';activeTopic=null;renderNav();renderSources();return}const c=COURSES.find(x=>x.id===id);if(!c)return;activeCourse=id;activeTopic=0;renderNav();renderCourse()}
function renderCourse(){const c=COURSES.find(x=>x.id===activeCourse);if(!c)return;renderNav();const groups=[...new Set(c.topics.map(t=>t.group))];const current=c.topics[activeTopic]||c.topics[0];app.innerHTML=`<div class="crumb">Fächer / ${escapeText(c.title)}</div>${hero(c.title,c.desc,'FACHÜBERSICHT',`${c.topics.length} Themen`)}<div class="statline">${statusBadge(c)}<span class="pill">${c.sources.length} Quellenhinweise</span></div><div class="split"><div class="topicpanel"><h3>Themen in diesem Fach</h3>${groups.map(g=>`<div class="topicgroup">${escapeText(g)}</div>${c.topics.map((t,i)=>t.group===g?`<button class="topicbtn ${i===activeTopic?'active':''}" data-topic="${i}">${escapeText(t.title)}</button>`:'').join('')}`).join('')}</div><article class="contentpanel">${renderTopic(c,current,activeTopic)}</article></div>`;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{activeTopic=+b.dataset.topic;done.push(`${c.id}:${activeTopic}`);localStorage.setItem('hslu-lernraum-done',JSON.stringify([...new Set(done)]));renderCourse()});bindInteractive();typeset()}
function renderTopic(c,t,i){let svg=t.diagram==='node'?`<svg class="diagram" viewBox="0 0 600 190" role="img" aria-label="Drei Seile treffen sich an einem Knotenpunkt"><line x1="300" y1="92" x2="130" y2="32" stroke="#47759b" stroke-width="4"/><line x1="300" y1="92" x2="490" y2="28" stroke="#47759b" stroke-width="4"/><line x1="300" y1="92" x2="300" y2="167" stroke="#47759b" stroke-width="4"/><circle cx="300" cy="92" r="8" fill="#3175c8"/><text x="115" y="24" font-size="16" fill="#485c70">T₁</text><text x="492" y="23" font-size="16" fill="#485c70">T₂</text><text x="313" y="160" font-size="16" fill="#485c70">F<tspan baseline-shift="sub">G</tspan></text><text x="265" y="118" font-size="13" fill="#748496">Knoten</text><text x="170" y="142" font-size="12" fill="#8190a0">Am Knoten: ΣFₓ = 0, ΣFᵧ = 0</text></svg>`:'';
let math=t.math?`<div class="mathbox">${t.math}</div>`:'';
let points=t.points?`<ul class="pointlist">${t.points.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
let ex=t.example?`<section class="example"><div class="example-title">Musterbeispiel · erst selbst überlegen</div><div class="example-body"><p>${t.example.q}</p><ol class="steps">${t.example.steps.map(x=>`<li>${x}</li>`).join('')}</ol><button class="reveal">Lösung anzeigen</button><div class="solution">${t.example.answer}</div></div></section>`:'';
let warn=(c.status!=='good'&&(['physik','ddt'].includes(c.id)||c.id==='wsk'&&i>1))?`<div class="warning">Quellenhinweis: ${c.id==='physik'?'Die hier abgedeckten Themen wurden aus vorhandenen Aufgabenbildern abgeleitet.':'Im verfügbaren Material ist dieser Themenbereich nicht vollständig dokumentiert.'} Bitte mit dem aktuellen Unterrichtsmaterial abgleichen.</div>`:'';
return `<div class="topic-head"><div><div class="eyebrow">${escapeText(t.group)}</div><h1>${escapeText(t.title)}</h1><p>${escapeText(c.title)} · Thema ${i+1} von ${c.topics.length}</p></div><button class="bookmark ${saved.includes(c.id+':'+i)?'saved':''}" title="Thema merken" data-save="${c.id}:${i}">${saved.includes(c.id+':'+i)?'★':'☆'}</button></div><p class="intro">${t.intro}</p>${svg}${math}${points}${warn}${ex}<div class="sourcefoot"><span>↗</span><div><strong>Quellenbasis</strong><br>${escapeText(t.source||c.sources.join(' · '))}</div></div>`}
function bindInteractive(){app.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{const s=b.parentElement.querySelector('.solution');s.classList.toggle('show');b.textContent=s.classList.contains('show')?'Lösung ausblenden':'Lösung anzeigen';typeset()});app.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const key=b.dataset.save;const n=saved.includes(key)?saved.filter(x=>x!==key):[...saved,key];saved.splice(0,saved.length,...n);localStorage.setItem('hslu-lernraum-saved',JSON.stringify(saved));renderCourse()})}
function renderSources(){app.innerHTML=`${hero('Quellenübersicht','Dateien und Grenzen der verfügbaren Kursmaterialien. Die App verwendet kurze, quellenbasierte Erklärungen und nennt hier die zugrunde liegenden Dateien.','MATERIALSTAND')}<div class="note">Die Originaldateien bleiben in deinen Kursordnern. Diese GitHub-fähige App enthält die aufbereiteten Lernkarten, nicht die privaten Original-PDFs. Wenn du die PDFs später neben die App kopierst, kannst du sie anhand der Dateinamen eindeutig zuordnen.</div>${COURSES.map(c=>`<div class="sectionlabel"><h2>${c.emoji} ${escapeText(c.title)}</h2>${statusBadge(c)}</div><div class="source-list">${c.sources.map((s,i)=>`<div class="source-item"><b>${escapeText(s)}</b><small>Referenz ${i+1} · Zuordnung aus vorhandenem Kursmaterial</small><span>${c.status==='good'?'Inhalt ausgewertet':c.status==='partial'?'Teilweise ausgewertet':'Begrenzte Grundlage'}</span></div>`).join('')}</div>`).join('')}`}
function renderSearch(q){query=q;const matches=allTopics().filter(t=>`${t.course.title} ${t.title} ${t.group} ${t.intro} ${(t.points||[]).join(' ')} ${t.source||''}`.toLocaleLowerCase('de').includes(q.toLocaleLowerCase('de')));activeCourse=null;activeTopic=null;renderNav();app.innerHTML=`${hero('Suchergebnisse',`Treffer für „${escapeText(q)}“`,'SUCHE')}<div class="course-grid">${matches.map(t=>`<button class="course-card" data-go="${t.course.id}:${t.idx}" style="--tone:${t.course.color}"><div class="cardtop"><span class="course-emoji">${t.course.emoji}</span><span class="pill">${escapeText(t.group)}</span></div><h3>${escapeText(t.title)}</h3><p>${escapeText(t.course.title)} · ${escapeText(t.intro.slice(0,110))}…</p><div class="cardmeta"><span>Erklärung öffnen</span><span>→</span></div></button>`).join('')||'<div class="empty">Keine passenden Themen. Probiere einen anderen Suchbegriff.</div>'}</div>`;app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const [id,i]=b.dataset.go.split(':');openCourse(id);activeTopic=+i;renderCourse()})}
function typeset(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([app]).catch(()=>{})}
search.addEventListener('input',()=>{const q=search.value.trim();if(q.length>1)renderSearch(q);else if(!q)renderHome()});document.getElementById('homeBtn').onclick=()=>{search.value='';renderHome()};renderHome();
</script>
</body>
</html>
